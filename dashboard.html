<!DOCTYPE html>
<html lang="de">
<head>
<script>try { const t = JSON.parse(localStorage.getItem('immone-theme')); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Immone Portal – Dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Immone Corporate Design: Nordisch + Marine */
  --navy: #002941; --navy-2: #0D3A57; --gold: #7FA6B8; --gold-ink: #2F6280;
  --paper: #F5F3EE; --surface: #FFFFFF; --surface-2: #F2F1EC; --ink: #1F3443; --ink-2: #34505F; --muted: #5B7686; --line: #E0E4E4;
  --frei: #1F8A53; --reserviert: #B25E0E; --vergeben: #C33A33;
  --c-frei: #2BB673; --c-reserviert: #F0952E; --c-vergeben: #E5483F;
  --t-frei: rgba(43,182,115,.14); --t-reserviert: rgba(240,149,46,.17); --t-vergeben: rgba(229,72,63,.12);
  --bar: #7FA6B8; --bar-2: #C9DDE8; --grid: #E9ECEC;
  --sev-hoch: #C33A33; --sev-mittel: #B25E0E; --sev-info: #2F6280;
  --shadow: 0 1px 2px rgba(0,41,65,.05), 0 8px 24px -14px rgba(0,41,65,.22);
  --side-active: rgba(127,166,184,.22); --hl-soft: rgba(127,166,184,.16); --side-ic: #A9C8D6; --hl-on: #0B1F2C; --pri: #002941; --pri-on: #fff;
  --font: 'Albert Sans', 'Helvetica Neue', Arial, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0A1A24; --surface: #10242F; --surface-2: #163040; --ink: #E6EEF2; --ink-2: #C3D3DC; --muted: #8FA9B8; --line: #21394A; --gold-ink: #A9C8D6; --navy: #061520;
    --frei: #5FD39A; --reserviert: #F5B067; --vergeben: #FF8A82; --bar: #7FA6B8; --bar-2: #2C4A5C; --grid: #1B3141;
    --t-frei: rgba(43,182,115,.2); --t-reserviert: rgba(240,149,46,.22); --t-vergeben: rgba(229,72,63,.2);
    --sev-hoch: #FF8A82; --sev-mittel: #F5B067; --sev-info: #A9C8D6; --pri: #7FA6B8; --pri-on: #061520; --hl-on: #061520;
    --hl-soft: rgba(127,166,184,.14); --side-active: rgba(127,166,184,.2); --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px -14px rgba(0,0,0,.5); color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #0A1A24; --surface: #10242F; --surface-2: #163040; --ink: #E6EEF2; --ink-2: #C3D3DC; --muted: #8FA9B8; --line: #21394A; --gold-ink: #A9C8D6; --navy: #061520;
    --frei: #5FD39A; --reserviert: #F5B067; --vergeben: #FF8A82; --bar: #7FA6B8; --bar-2: #2C4A5C; --grid: #1B3141;
    --t-frei: rgba(43,182,115,.2); --t-reserviert: rgba(240,149,46,.22); --t-vergeben: rgba(229,72,63,.2);
    --sev-hoch: #FF8A82; --sev-mittel: #F5B067; --sev-info: #A9C8D6; --pri: #7FA6B8; --pri-on: #061520; --hl-on: #061520;
    --hl-soft: rgba(127,166,184,.14); --side-active: rgba(127,166,184,.2); --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px -14px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.side { background: var(--navy); color: #DCE4EA; padding: 22px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 22px; color: #fff; text-decoration: none; }
.brand .mark { width: 32px; height: 32px; border-radius: 9px; background: var(--gold); display: grid; place-items: center; color: var(--hl-on); font-weight: 800; font-size: 17px; }
.brand b { font-size: 18px; letter-spacing: -.01em; }
.brand small { display: block; font-size: 11.5px; color: #93A6B6; font-weight: 500; margin-top: -2px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; text-decoration: none; color: #C9D5DE; font-weight: 550; }
.nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a[aria-current="page"] { background: var(--side-active); color: #fff; }
.nav a[aria-current="page"] svg { stroke: var(--side-ic); }
.nav .cnt { margin-left: auto; background: var(--gold); color: var(--hl-on); font-size: 11.5px; font-weight: 800; border-radius: 99px; padding: 1px 7px; }
.side-foot { margin-top: auto; padding: 12px; font-size: 12px; color: #93A6B6; border-top: 1px solid rgba(255,255,255,.08); }
.side-foot a { color: #A9C8D6; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 14px; padding: 16px 28px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top h1 { font-size: 20px; margin: 0; letter-spacing: -.015em; white-space: nowrap; }
.top .grow { flex: 1; }
.sel, .inp { height: 38px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 0 12px; min-width: 0; }
.sel { padding-right: 30px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 15px top 16px, right 10px top 16px; background-size: 5px 5px; background-repeat: no-repeat; }
.search { width: 210px; }
.themebtn { height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; color: var(--ink-2); flex: none; }
.themebtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.themebtn:hover { border-color: var(--gold); }
.user { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.user i { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 13px; }
:root[data-theme="dark"] .user i { background: var(--gold); color: var(--navy); }
.demo { margin: 16px 28px 0; padding: 10px 14px; border-radius: 10px; background: var(--hl-soft); color: var(--ink-2); font-size: 13.5px; display: flex; gap: 10px; align-items: center; }
.demo svg { flex: none; width: 18px; height: 18px; stroke: var(--gold-ink); fill: none; stroke-width: 1.8; }
.demo a { color: var(--gold-ink); font-weight: 650; }
#view { padding: 20px 28px 48px; display: flex; flex-direction: column; gap: 18px; max-width: 1480px; width: 100%; }

/* ---------- Cards & tiles ---------- */
.grid { display: grid; gap: 18px; }
.g-kpi { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.g-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.g-21 { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.g-12 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr); }
.g-obj { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.fill { display: flex; flex-direction: column; }
.fill .chart { flex: 1; min-height: 220px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 15.5px; margin: 0 0 2px; letter-spacing: -.005em; }
.card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.card-h { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--gold-ink); font-weight: 650; font-size: 13.5px; text-decoration: none; }
.link:hover { text-decoration: underline; }
.kpi { padding: 15px 16px; }
.kpi .l { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.kpi .v { font-size: 26px; font-weight: 750; letter-spacing: -.02em; margin-top: 3px; line-height: 1.15; white-space: nowrap; }
.kpi .v small { font-size: 15px; font-weight: 650; color: var(--muted); margin-left: 2px; }
.kpi .h { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.up { color: var(--frei); font-weight: 650; } .down { color: var(--vergeben); font-weight: 650; }

.obj { cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s; }
.obj:hover { border-color: var(--gold); }
.obj .t { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.obj h3 { margin: 0; font-size: 15.5px; }
.obj .a { color: var(--muted); font-size: 12.5px; }
.amp { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.amp::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.amp.ok { color: var(--frei); background: var(--t-frei); } .amp.mid { color: var(--reserviert); background: var(--t-reserviert); } .amp.bad { color: var(--vergeben); background: var(--t-vergeben); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.nums div { font-size: 12px; color: var(--muted); } .nums b { display: block; font-size: 16px; color: var(--ink); }

/* Status */
.stack { display: flex; gap: 2px; height: 10px; }
.stack span { display: block; height: 100%; min-width: 3px; }
.stack span:first-child { border-radius: 4px 0 0 4px; } .stack span:last-child { border-radius: 0 4px 4px 0; } .stack span:only-child { border-radius: 4px; }
.s-frei { background: var(--c-frei); } .s-reserviert { background: var(--c-reserviert); } .s-vergeben { background: var(--c-vergeben); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend b { color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.tag::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tag.st-frei { background: var(--t-frei); color: var(--frei); } .tag.st-reserviert { background: var(--t-reserviert); color: var(--reserviert); } .tag.st-vergeben { background: var(--t-vergeben); color: var(--vergeben); }
.tag.plain { background: var(--surface-2); color: var(--ink-2); } .tag.plain::before { display: none; }
.tag.live { background: var(--hl-soft); color: var(--gold-ink); }

/* Hinweise */
.hints { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.hint { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: start; padding: 12px 4px; border-top: 1px solid var(--line); }
.hint:first-child { border-top: 0; }
.hint .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.hint .ic svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hint.hoch .ic { color: var(--sev-hoch); background: var(--t-vergeben); }
.hint.mittel .ic { color: var(--sev-mittel); background: var(--t-reserviert); }
.hint.info .ic { color: var(--sev-info); background: rgba(44,90,128,.12); }
.hint b { display: block; font-size: 14px; }
.hint p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.hint .sev { font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.hint.hoch .sev { color: var(--sev-hoch); } .hint.mittel .sev { color: var(--sev-mittel); } .hint.info .sev { color: var(--sev-info); }
.btn { height: 34px; padding: 0 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.btn:hover { border-color: var(--gold); }
.btn.pri { background: var(--pri); color: var(--pri-on); border-color: var(--pri); }
:root[data-theme="dark"] .btn.pri { background: var(--gold); color: var(--navy); border-color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.pri { background: var(--gold); color: var(--navy); border-color: var(--gold); } :root:not([data-theme="light"]) .user i { background: var(--gold); color: var(--navy); } }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; }
.chart text { font-family: var(--font); fill: var(--muted); font-size: 11.5px; }
.hb { display: flex; flex-direction: column; gap: 9px; }
.hb-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr 64px; gap: 10px; align-items: center; font-size: 13px; }
.hb-row .lb { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-row .tr { height: 12px; position: relative; }
.hb-row .fl { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 3px; }
.hb-row .vl { text-align: right; font-weight: 650; }
.hb-row .vl small { color: var(--muted); font-weight: 500; }
.funnel .hb-row { grid-template-columns: minmax(142px, 34%) 1fr 92px; }
.funnel .fl { background: var(--bar); }
.split { display: flex; gap: 2px; height: 12px; margin: 6px 0 10px; }
.split span:first-child { border-radius: 4px 0 0 4px; } .split span:last-child { border-radius: 0 4px 4px 0; }
#tip { position: fixed; pointer-events: none; z-index: 90; background: var(--navy); color: #fff; padding: 8px 11px; border-radius: 9px; font-size: 12.5px; line-height: 1.35; box-shadow: 0 8px 22px rgba(0,0,0,.25); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 240px; }
#tip.on { opacity: 1; transform: none; }
#tip b { display: block; font-size: 13px; }
:root[data-theme="dark"] #tip { background: #F2F5F7; color: var(--navy); }

/* Building */
.bld { display: flex; flex-direction: column; gap: 5px; }
.fl-row { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; align-items: stretch; }
.fl-row > span { white-space: nowrap; font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; }
.cells { display: grid; gap: 5px; }
.cell { border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 7px; padding: 6px 7px; text-align: left; background: var(--surface); min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.cell b { font-size: 12.5px; } .cell small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.st-frei { border-left-color: var(--c-frei); background: var(--t-frei); } .cell.st-reserviert { border-left-color: var(--c-reserviert); background: var(--t-reserviert); } .cell.st-vergeben { border-left-color: var(--c-vergeben); background: var(--t-vergeben); }
.cell:hover, .cell.sel { outline: 2px solid var(--gold); outline-offset: 1px; }
.cell.dim { opacity: .28; }

/* Table */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.chip { text-decoration: none; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--pri); color: var(--pri-on); border-color: var(--pri); }
:root[data-theme="dark"] .chip[aria-pressed="true"] { background: var(--gold); color: var(--navy); border-color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { background: var(--gold); color: var(--navy); border-color: var(--gold); } }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 11px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 700; background: var(--surface-2); position: sticky; top: 0; }
th button { background: none; border: 0; padding: 0; font-weight: 700; color: inherit; font-size: 12px; }
th button[data-dir]::after { content: ' ↓'; } th button[data-dir="asc"]::after { content: ' ↑'; }
td.n, th.n { text-align: right; }
tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.empty { color: var(--muted); padding: 18px 4px; font-size: 13.5px; }

/* Drawer */
#scrim { position: fixed; inset: 0; background: rgba(8,18,28,.42); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
#scrim.on { opacity: 1; pointer-events: auto; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); z-index: 70; box-shadow: -18px 0 40px rgba(0,0,0,.18); transform: translateX(104%); transition: transform .24s ease, visibility 0s linear .24s; visibility: hidden; display: flex; flex-direction: column; }
#drawer.on { transform: none; visibility: visible; transition: transform .24s ease, visibility 0s; }
.dr-h { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.dr-h h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.dr-h p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.x { margin-left: auto; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.x svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }
.dr-b { overflow-y: auto; padding: 18px 22px 32px; display: flex; flex-direction: column; gap: 20px; }
.dr-b h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 9px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.facts div { background: var(--surface-2); border-radius: 10px; padding: 9px 11px; font-size: 12px; color: var(--muted); }
.facts b { display: block; font-size: 15px; color: var(--ink); margin-top: 1px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 7px; }
.seg button i { width: 9px; height: 9px; border-radius: 50%; }
.seg button[aria-pressed="true"] { border-width: 2px; }
.seg button[aria-pressed="true"].st-frei { border-color: var(--c-frei); background: var(--t-frei); }
.seg button[aria-pressed="true"].st-reserviert { border-color: var(--c-reserviert); background: var(--t-reserviert); }
.seg button[aria-pressed="true"].st-vergeben { border-color: var(--c-vergeben); background: var(--t-vergeben); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.fld .inp { color: var(--ink); font-weight: 500; width: 100%; min-width: 0; }
textarea.inp { height: 84px; padding: 9px 12px; resize: vertical; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.hist li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; }
.hist time { color: var(--muted); font-size: 12.5px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mini div { text-align: center; background: var(--surface-2); border-radius: 10px; padding: 9px 4px; font-size: 11.5px; color: var(--muted); }
.mini b { display: block; font-size: 17px; color: var(--ink); }
.note-hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* Live */

// ================= Wohnungsakte =================
let OPEN = null;
function openUnit(key) { if (!UBY[key]) return; OPEN = key; renderDrawer(); $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on'); setTimeout(() => { const x = $('#drawer .x'); x && x.focus(); }, 60); }
function closeUnit() { OPEN = null; $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on'); }
function renderDrawer() {
  const u = UBY[OPEN]; if (!u) return;
  const o = OBJ[u.obj], s = st(u), fs = freeSince(u);
  const rv = unitRooms(u); const rA = Object.entries(rv).sort((a, b) => b[1] - a[1]).slice(0, 5); const rmax = rA.length ? rA[0][1] : 1; const rsum = Object.values(rv).reduce((a, b) => a + b, 0) || 1;
  const q = unitInq(u), vis = q.filter(a => ['besichtigung', 'zusage'].includes(inqStatus(a))).length;
  const hist = (D.hist[u.key] || []).slice().reverse();
  const seedHist = [{ t: addDays(TODAY, -40).getTime(), txt: 'Wohnung angelegt, Rundgang veröffentlicht' }];
  const navUrl = new URL('index.html#' + u.id, location.href).href;
  const tourUrl = new URL('index.html?rundgang=1#' + u.id, location.href).href;
  const facts = o.mode === 'rent'
    ? [['Zimmer', u.zi], ['Wohnfläche', m2(u.area)], ['Etage', FLOOR_NAME(u.floor)], ['Kaltmiete', eur(kalt(u))], ['Warmmiete', eur(kalt(u) + u.nk)], ['Kaltmiete/m²', nf2.format(kalt(u) / u.area) + ' €']]
    : [['Zimmer', u.zi], ['Wohnfläche', m2(u.area)], ['Etage', FLOOR_NAME(u.floor)], ['Kaufpreis', eur(price(u))], ['Preis/m²', nf0.format(price(u) / u.area) + ' €'], ['Lage', u.orient]];
  $('#drawer').innerHTML = `
  <div class="dr-h"><div><h2>Wohnung ${u.no}</h2><p>${esc(o.name)} · ${esc(u.typeLabel)} · ${esc(u.orient)}</p><div style="margin-top:8px"><span class="tag st-${s}">${stLabel(u)}</span></div></div>
    <button class="x" data-close aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dr-b">
    <div class="facts">${facts.map(([l, v]) => `<div>${l}<b>${v}</b></div>`).join('')}</div>
    <div class="no-print"><h3>Status</h3><div class="seg" role="group" aria-label="Status ändern">${['frei', 'reserviert', 'vergeben'].map(k => `<button class="st-${k}" data-setst="${k}" aria-pressed="${s === k}"><i class="s-${k}"></i>${STATUS[k][o.mode]}</button>`).join('')}</div>
      <p class="note-hint">${o.tour ? 'Änderungen erscheinen sofort im Navigator.' : 'Bei Lindenhain-Höfe erscheinen Änderungen sofort im Navigator, die anderen Objekte sind reine Beispiele.'}</p>
      <div class="row2" style="margin-top:12px">
        ${s === 'reserviert' ? `<label class="fld">Reserviert bis<input class="inp" type="date" data-res value="${resUntil(u) ? isoD(resUntil(u)) : ''}"></label>` : s === 'frei' ? `<label class="fld">Frei seit<input class="inp" type="text" value="${fs ? fmtD(fs) + ' (' + dDiff(fs, TODAY) + ' Tage)' : '–'}" readonly></label>` : `<label class="fld">${o.mode === 'rent' ? 'Gekündigt, frei ab' : 'Verkauft'}<input class="inp" type="text" value="${u.freiAb ? fmtD(u.freiAb) : '–'}" readonly></label>`}
        <label class="fld">${o.mode === 'rent' ? 'Kaltmiete (€)' : 'Kaufpreis (€)'}<input class="inp" type="number" min="0" step="${o.mode === 'rent' ? 10 : 1000}" data-price value="${Math.round(val(u))}"></label>
      </div></div>
    <div><h3>Letzte 30 Tage</h3><div class="mini"><div><b>${nf0.format(unitViews(u))}</b>Aufrufe</div><div><b>${Math.floor(u.dwell / 60)}:${String(u.dwell % 60).padStart(2, '0')}</b>Ø Min.</div><div><b>${q.length}</b>Anfragen</div><div><b>${vis}</b>Besichtigungen</div></div>
      <div class="hb" style="margin-top:14px">${rA.map(([l, v]) => `<div class="hb-row"><span class="lb">${esc(l)}</span><span class="tr"><span class="fl" style="display:block;width:${v / rmax * 100}%"></span></span><span class="vl">${nf0.format(v / rsum * 100)} %</span></div>`).join('')}</div>
      <p class="note-hint">Anteil der Aufrufe je Raum im Rundgang.</p></div>
    ${q.length ? `<div><h3>Anfragen zu dieser Wohnung</h3><ul class="hist">${q.slice(0, 5).map(a => `<li><time>${fmtD(new Date(a.t))}</time><span><b>${esc(a.name)}</b> · ${a.ch} · ${INQ_ST[inqStatus(a)]}${a.live ? ' <span class="tag live">Live</span>' : ''}</span></li>`).join('')}</ul></div>` : ''}
    <div class="no-print"><h3>Notizen</h3><textarea class="inp" style="width:100%" data-note placeholder="z. B. Interessent ruft Freitag zurück, Küche wird bis 01.03. erneuert">${esc(D.notes[u.key] || '')}</textarea><p class="note-hint">Wird automatisch gespeichert.</p></div>
    <div><h3>Verlauf</h3><ul class="hist">${hist.map(h => `<li><time>${fmtD(new Date(h.t))}</time><span>${esc(h.txt)} <span class="sub">· ${esc(h.who || 'Phil G.')}</span></span></li>`).join('')}${seedHist.map(h => `<li><time>${fmtD(new Date(h.t))}</time><span>${h.txt} <span class="sub">· System</span></span></li>`).join('')}</ul></div>
    <div class="acts no-print">${o.tour ? `<a class="btn pri" href="${tourUrl}" target="_blank" rel="noopener">${ico('ext')}360°-Rundgang starten</a><a class="btn" href="${navUrl}" target="_blank" rel="noopener">${ico('bld')}Im Navigator zeigen</a><button class="btn" data-copylink="${navUrl}">${ico('copy')}Link für Interessenten</button>` : `<button class="btn" disabled title="Nur bei Lindenhain-Höfe gibt es einen echten Rundgang">${ico('ext')}Kein echter Rundgang (Beispiel)</button>`}<button class="btn" data-print>${ico('print')}Exposé drucken</button></div>
  </div>`;
}
function setStatus(u, s) {
  const old = st(u); if (old === s) return;
  if (s === u.status0) delete SO[u.key]; else SO[u.key] = s;
  store.set(K_STATUS, SO);
  (D.hist[u.key] = D.hist[u.key] || []).push({ t: Date.now(), from: old, to: s, txt: `Status: ${stLabel(u, old)} → ${stLabel(u, s)}` });
  if (s === 'reserviert' && !D.res[u.key]) D.res[u.key] = addDays(TODAY, 7).getTime();
  saveD();
  toast(OBJ[u.obj].tour ? `Wohnung ${u.no} ist jetzt „${stLabel(u, s)}“, auch im Navigator` : `Wohnung ${u.no} ist jetzt „${stLabel(u, s)}“`);
  render(); renderDrawer();
}

// ================= Diagramme =================
function lineChart(el, series, opts = {}) {
  const W = el.clientWidth, H = el.clientHeight; if (!W) return;
  const cur = series.slice(30), prev = opts.compare ? series.slice(0, 30) : null;
  const P = { l: 40, r: 10, t: 10, b: 26 };
  const max = Math.max(...cur.map(x => x.v), ...(prev ? prev.map(x => x.v) : [0])) * 1.12;
  const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const x = i => P.l + i * (W - P.l - P.r) / (cur.length - 1), y = v => P.t + (H - P.t - P.b) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end">${nf0.format(v)}</text>`;
  const every = W < 480 ? 7 : 5;
  cur.forEach((p, i) => { if ((cur.length - 1 - i) % every === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${fmtDs(p.d)}</text>`; });
  const path = arr => arr.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = path(cur) + `L${x(cur.length - 1)},${y(0)}L${x(0)},${y(0)}Z`;
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Aufrufe pro Tag, letzte 30 Tage">${g}
    <path d="${area}" fill="var(--bar)" opacity=".08"/>
    ${prev ? `<path d="${path(prev)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>` : ''}
    <path d="${path(cur)}" fill="none" stroke="var(--bar)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="xh" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
    <circle class="dot" r="4.5" fill="var(--bar)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
    <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" class="hit"/></svg>`;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh'), dot = svg.querySelector('.dot');
  const move = ev => {
    const r = svg.getBoundingClientRect(); const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const i = Math.max(0, Math.min(cur.length - 1, Math.round((cx - P.l) / (W - P.l - P.r) * (cur.length - 1))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('opacity', '.5');
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(cur[i].v)); dot.setAttribute('opacity', '1');
    const wd = cur[i].d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
    showTip(`<b>${wd}</b>${nf0.format(cur[i].v)} Aufrufe${prev ? `<br><span style="opacity:.75">30 Tage davor: ${nf0.format(prev[i].v)}</span>` : ''}`, r.left + x(i), r.top + y(cur[i].v));
  };
  const leave = () => { xh.setAttribute('opacity', '0'); dot.setAttribute('opacity', '0'); hideTip(); };
  svg.addEventListener('mousemove', move); svg.addEventListener('touchmove', move, { passive: true }); svg.addEventListener('mouseleave', leave); svg.addEventListener('touchend', leave);
}
function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function drawCharts() {
  $$('[data-chart]').forEach(el => {
    const k = el.dataset.chart; const s = viewsSeries(objList());
    lineChart(el, s, { compare: k === 'views2' });
  });
}

// ================= Tooltip & Toast =================
const tip = $('#tip');
function showTip(html, x, y) { tip.innerHTML = html; tip.classList.add('on'); const w = tip.offsetWidth, h = tip.offsetHeight; let L = x - w / 2, T = y - h - 14; L = Math.max(8, Math.min(innerWidth - w - 8, L)); if (T < 8) T = y + 16; tip.style.left = L + 'px'; tip.style.top = T + 'px'; }
function hideTip() { tip.classList.remove('on'); }
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (!t) return; const r = t.getBoundingClientRect(); showTip(t.dataset.tip, r.left + r.width / 2, r.top); });
document.addEventListener('mouseout', e => { const t = e.target.closest('[data-tip]'); if (t && !t.contains(e.relatedTarget)) hideTip(); });
let tt; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3200); }

// ================= Ereignisse =================
document.addEventListener('click', e => {
  const t = e.target;
  const go = t.closest('[data-go]'); if (go) { location.hash = go.dataset.go; return; }
  if (t.closest('[data-close]') || t === $('#scrim')) { closeUnit(); return; }
  const st_ = t.closest('[data-setst]'); if (st_) { setStatus(UBY[OPEN], st_.dataset.setst); return; }
  if (t.closest('select, input, textarea, a')) return;
  const un = t.closest('[data-unit]'); if (un) { openUnit(un.dataset.unit); return; }
  const so = t.closest('[data-sort]'); if (so) { const [tid, k] = so.dataset.sort.split(':'); const c = TBL[tid]; c.dir = c.sort === k && c.dir === 'asc' ? 'desc' : 'asc'; if (c.sort !== k) c.dir = ['views', 'inq', 'since', 'val', 'area', 'sqm'].includes(k) ? 'desc' : 'asc'; c.sort = k; store.set('immone-dash-tbl', TBL); render(); return; }
  const fi = t.closest('[data-filt]'); if (fi) { const [tid, , v] = fi.dataset.filt.split(':'); TBL[tid].st = v; store.set('immone-dash-tbl', TBL); render(); return; }
  const iq = t.closest('[data-inqf]'); if (iq) { INQ_F = iq.dataset.inqf; render(); return; }
  const cv = t.closest('[data-csv]'); if (cv) { csv(cv.dataset.csv); return; }
  if (t.closest('[data-print]')) { window.print(); return; }
  const cl = t.closest('[data-copylink]'); if (cl) { copy(cl.dataset.copylink, 'Link kopiert. Interessenten landen direkt auf dieser Wohnung.'); return; }
  if (t.closest('[data-copy]')) { copy($('pre.code').textContent, 'Einbettungscode kopiert'); return; }
  if (t.closest('[data-demo-only]')) { toast('Im Prototyp nicht aktiv, kommt mit der Plattform-Version'); return; }
  if (t.closest('[data-reset]')) { ['immone-status-v1', 'immone-events-v1', 'immone-dash-v1', 'immone-dash-tbl', 'immone-dash-filter'].forEach(k => { try { localStorage.removeItem(k); } catch (e2) {} }); location.hash = '#/uebersicht'; location.reload(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-zi]')) { TBL[t.dataset.zi].zi = t.value; store.set('immone-dash-tbl', TBL); render(); }
  if (t.matches('[data-inq]')) { const a = allInquiries().find(x => x.id === t.dataset.inq); D.inq[a.id] = t.value; saveD(); toast(`Anfrage von ${a.name}: ${INQ_ST[t.value]}`); render(); }
  if (t.matches('[data-res]') && OPEN) { D.res[OPEN] = new Date(t.value).getTime(); (D.hist[OPEN] = D.hist[OPEN] || []).push({ t: Date.now(), txt: 'Reservierung bis ' + fmtD(new Date(t.value)) }); saveD(); render(); renderDrawer(); toast('Reservierungsdatum gespeichert'); }
  if (t.matches('[data-price]') && OPEN) { const u = UBY[OPEN]; const v = Math.max(0, Math.round(+t.value)); const old = val(u); if (!v || v === Math.round(old)) return; D.price[OPEN] = v; (D.hist[OPEN] = D.hist[OPEN] || []).push({ t: Date.now(), txt: `${OBJ[u.obj].mode === 'rent' ? 'Kaltmiete' : 'Kaufpreis'}: ${eur(old)} → ${eur(v)}` }); saveD(); render(); renderDrawer(); toast('Preis gespeichert'); }
});
let nt; document.addEventListener('input', e => { if (e.target.matches('[data-note]') && OPEN) { const k = OPEN, v = e.target.value; clearTimeout(nt); nt = setTimeout(() => { D.notes[k] = v; saveD(); }, 400); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && OPEN) closeUnit(); });
function copy(txt, msg) { (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(msg), () => { prompt('Kopieren:', txt); }); }
// Live: Änderungen aus dem Navigator (anderer Tab) sofort übernehmen
window.addEventListener('storage', e => {
  if (e.key === K_EVENTS) { const before = EV.length; EV = store.get(K_EVENTS, []); const n = EV[EV.length - 1]; render(); if (OPEN) renderDrawer();
    if (n && EV.length > before) { const u = UBY['lindenhain:' + n.unit]; toast(n.type === 'ask' ? `Neue Anfrage zu Wohnung ${u ? u.no : ''}` : `Live: Wohnung ${u ? u.no : ''} ${n.type === 'room' ? '· ' + (n.roomName || 'Rundgang') : EV_TXT[n.type]}`); } }
  if (e.key === K_STATUS) { SO = store.get(K_STATUS, {}); render(); if (OPEN) renderDrawer(); }
});
setInterval(() => { $$('time[data-t]').forEach(t => { t.textContent = ago(+t.dataset.t); }); }, 30000);

// ================= Hell / Dunkel (gemeinsam mit dem Navigator gespeichert) =================
const ICON_SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>';
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
function paintTheme() { const b = $('#themeBtn'); b.innerHTML = (isDark() ? ICON_SUN : ICON_MOON) + `<span>${isDark() ? 'Hell' : 'Dunkel'}</span>`; b.setAttribute('aria-label', isDark() ? 'Helles Design einschalten' : 'Dunkles Design einschalten'); }
$('#themeBtn').addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('immone-theme', t); paintTheme(); drawCharts(); });
window.addEventListener('storage', e => { if (e.key === 'immone-theme') { const t = store.get('immone-theme', null); if (t) document.documentElement.dataset.theme = t; paintTheme(); drawCharts(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paintTheme(); drawCharts(); });
paintTheme();

// ================= Rendern =================
const TITLES = { uebersicht: 'Übersicht', objekt: 'Objekt', wohnungen: 'Wohnungen', anfragen: 'Anfragen', statistik: 'Rundgang-Statistik', hinweise: 'Hinweise', verwaltung: 'Verwaltung' };
let lastPage = null;
function render() {
  const r = route();
  renderNav(r.page);
  const y = scrollY;
  $('#pageTitle').textContent = r.page === 'objekt' ? (OBJ[r.arg] || OBJ.lindenhain).name : TITLES[r.page];
  document.title = $('#pageTitle').textContent + ' · Immone Portal';
  const v = $('#view');
  v.innerHTML = r.page === 'objekt' ? pageObject(r.arg) : r.page === 'wohnungen' ? pageUnits() : r.page === 'anfragen' ? pageInquiries() : r.page === 'statistik' ? pageStats() : r.page === 'hinweise' ? pageHints() : r.page === 'verwaltung' ? pageAdmin() : pageOverview();
  drawCharts();
  if (lastPage === location.hash) scrollTo(0, y); else scrollTo(0, 0);
  lastPage = location.hash;
}
window.addEventListener('hashchange', () => { hideTip(); render(); });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawCharts, 120); });
render();
const startUnit = new URLSearchParams(location.search).get('w'); if (startUnit && UBY[startUnit]) openUnit(startUnit);
})();
