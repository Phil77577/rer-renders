<!DOCTYPE html>
<html lang="de">
<head>
<script>try { const t = JSON.parse(localStorage.getItem('immone-theme')); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Immone – Objekt anlegen</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #002941; --gold: #7FA6B8; --gold-ink: #2F6280;
  --paper: #F5F3EE; --surface: #FFFFFF; --surface-2: #F2F1EC; --ink: #1F3443; --ink-2: #34505F; --muted: #5B7686; --line: #E0E4E4;
  --ok: #1F8A53; --warn: #B25E0E; --err: #9B1C1C; --t-ok: rgba(43,182,115,.14); --t-warn: rgba(240,149,46,.17); --t-err: rgba(179,38,30,.11);
  --coral: #FF6574; --coral-on: #1A1C1D; --hellblau: #CCDCEF;
  --pri: #002941; --pri-on: #fff; --hl-soft: rgba(127,166,184,.16);
  --room: rgba(47,98,128,.16); --room-line: #2F6280; --sel: #FF6574; --canvas: #EDEBE5;
  --shadow: 0 1px 2px rgba(0,41,65,.05), 0 8px 24px -14px rgba(0,41,65,.22);
  --font: 'Albert Sans', 'Helvetica Neue', Arial, sans-serif; --r: 14px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --navy: #1A1C1D; --gold: #CCDCEF; --gold-ink: #CCDCEF; --paper: #222526; --surface: #2B2E30; --surface-2: #33373A; --ink: #EEF1F4; --ink-2: #CDD3D9; --muted: #9EA6AD; --line: #3B3F42;
    --ok: #5FD39A; --warn: #F5B067; --err: #EE8379; --t-ok: rgba(43,182,115,.2); --t-warn: rgba(240,149,46,.22); --t-err: rgba(200,48,42,.26);
    --pri: #CCDCEF; --pri-on: #1A1C1D; --hl-soft: rgba(204,220,239,.11); --room: rgba(204,220,239,.18); --room-line: #CCDCEF; --canvas: #1C1E1F;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px -14px rgba(0,0,0,.6); color-scheme: dark; }
}
:root[data-theme="dark"] { --navy: #1A1C1D; --gold: #CCDCEF; --gold-ink: #CCDCEF; --paper: #222526; --surface: #2B2E30; --surface-2: #33373A; --ink: #EEF1F4; --ink-2: #CDD3D9; --muted: #9EA6AD; --line: #3B3F42;
    --ok: #5FD39A; --warn: #F5B067; --err: #EE8379; --t-ok: rgba(43,182,115,.2); --t-warn: rgba(240,149,46,.22); --t-err: rgba(200,48,42,.26);
    --pri: #CCDCEF; --pri-on: #1A1C1D; --hl-soft: rgba(204,220,239,.11); --room: rgba(204,220,239,.18); --room-line: #CCDCEF; --canvas: #1C1E1F;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px -14px rgba(0,0,0,.6); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.45; overflow-x: clip; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--gold-ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Kopf */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 22px; background: var(--navy); color: #fff; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 750; }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--coral); color: var(--coral-on); display: grid; place-items: center; font-weight: 800; }
.brand small { display: block; font-weight: 500; font-size: 11.5px; color: rgba(255,255,255,.6); }
.top .grow { flex: 1; }
.top a.back { color: rgba(255,255,255,.82); text-decoration: none; font-weight: 600; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.top a.back:hover { color: #fff; }
.themebtn { height: 34px; padding: 0 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; color: #fff; }

/* Schritte */
.steps { display: flex; gap: 6px; padding: 14px 22px 0; overflow-x: auto; scrollbar-width: none; }
.steps button { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px 6px 6px; font-weight: 650; font-size: 13px; color: var(--muted); white-space: nowrap; }
.steps button b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font-size: 12px; }
.steps button[aria-current="step"] { color: var(--ink); border-color: var(--pri); }
.steps button[aria-current="step"] b { background: var(--pri); color: var(--pri-on); }
.steps button.done b { background: var(--t-ok); color: var(--ok); }

.wrap { padding: 16px 22px 40px; max-width: 1500px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: -.01em; }
h3 { font-size: 14px; margin: 0 0 8px; }
.sub { color: var(--muted); margin: 0 0 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
label.f { display: grid; gap: 5px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
label.f small { font-weight: 500; color: var(--muted); }
.inp, .sel { height: 38px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 0 11px; min-width: 0; width: 100%; }
.inp:focus, .sel:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.btn { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--gold); }
.btn.pri { background: var(--pri); border-color: var(--pri); color: var(--pri-on); }
.btn.pri svg { stroke: var(--coral); }
.btn.danger { color: var(--err); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.note { display: flex; gap: 10px; padding: 11px 14px; border-radius: 12px; background: var(--hl-soft); color: var(--ink-2); font-size: 13px; margin-bottom: 14px; }
.note svg { color: var(--gold-ink); margin-top: 1px; }
.drop { border: 1.5px dashed var(--line); border-radius: 14px; padding: 26px; text-align: center; color: var(--muted); background: var(--surface-2); }
.drop.over { border-color: var(--gold); background: var(--hl-soft); }
.drop b { color: var(--ink); }
.list { display: grid; gap: 10px; margin-top: 14px; }
.item { display: grid; grid-template-columns: 84px minmax(0,1fr) auto; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface); }
.item img { width: 84px; height: 64px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--line); }
.item .meta { display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 650; }
.pill.ok { background: var(--t-ok); color: var(--ok); } .pill.warn { background: var(--t-warn); color: var(--warn); } .pill.err { background: var(--t-err); color: var(--err); } .pill.neutral { background: var(--surface-2); color: var(--muted); }

/* Editor */
.ed { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 14px; }
.ed-main { display: grid; grid-template-rows: auto minmax(0,1fr); min-width: 0; padding: 0; overflow: hidden; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 10px; border-bottom: 1px solid var(--line); }
.tools .t { height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tools .t[aria-pressed="true"] { background: var(--pri); color: var(--pri-on); border-color: var(--pri); }
.tools .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
.tools .sel { width: auto; height: 34px; }
.stage { position: relative; height: min(72vh, 760px); background: var(--canvas); touch-action: none; }
.stage svg.cv { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.stage.t-select svg.cv { cursor: default; } .stage.t-pan svg.cv { cursor: grab; } .stage:not(.t-select):not(.t-pan) svg.cv { cursor: crosshair; }
.hint { position: absolute; left: 12px; bottom: 12px; right: 12px; pointer-events: none; display: flex; justify-content: flex-start; }
.hint span { background: rgba(0,41,65,.86); color: #fff; padding: 7px 11px; border-radius: 9px; font-size: 12.5px; max-width: 100%; }
.zoom { position: absolute; right: 12px; top: 12px; display: grid; gap: 6px; }
.zoom button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; color: var(--ink); }
.scalebox { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); display: none; gap: 8px; align-items: center; }
.scalebox.on { display: flex; }
.scalebox .inp { width: 90px; }
.side { display: grid; gap: 14px; align-content: start; min-width: 0; }
.checks { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.checks li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 7px 9px; border-radius: 9px; }
.checks li.ok { background: var(--t-ok); } .checks li.warn { background: var(--t-warn); } .checks li.err { background: var(--t-err); }
.checks li i { font-style: normal; font-weight: 800; width: 14px; flex: none; }
.checks li.ok i { color: var(--ok); } .checks li.warn i { color: var(--warn); } .checks li.err i { color: var(--err); }
.checks li[data-sel] { cursor: pointer; }
.props { display: grid; gap: 10px; }
.props .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.kv b { color: var(--ink); }
.plantabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.plantabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 650; font-size: 13px; display: inline-flex; gap: 7px; align-items: center; color: var(--ink-2); }
.plantabs button[aria-pressed="true"] { border-color: var(--pri); color: var(--ink); box-shadow: inset 0 0 0 1px var(--pri); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }

/* SVG-Inhalte */
.cv { --room: rgba(47,98,128,.15); --room-line: #2F6280; --pl-ink: #002941; --pl-ink2: #34505F; --pl-bg: #fff; }
.cv .rm rect { fill: var(--room); stroke: var(--room-line); stroke-width: 2; vector-effect: non-scaling-stroke; }
.cv .rm.sel rect { stroke: var(--sel); stroke-width: 3; }
.cv .lbl { fill: var(--pl-ink); font-weight: 750; paint-order: stroke; stroke: var(--pl-bg); stroke-width: 4px; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.cv .lbl .a { font-weight: 600; fill: var(--pl-ink2); }
.cv .bal rect { fill: none; stroke: var(--room-line); stroke-width: 2; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
.cv .bal.sel rect { stroke: var(--sel); }
.cv .dr line { stroke: #2BB673; stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.cv .wn line { stroke: #4A90C2; stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.cv .en line { stroke: var(--coral); stroke-width: 7; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.cv .sel line { stroke: var(--sel) !important; }
.cv line.hit { stroke: transparent !important; stroke-width: 18px !important; }
.cv .fx rect { fill: #fff; stroke: var(--pl-ink2); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.cv .fx text { fill: var(--pl-ink2); font-weight: 700; pointer-events: none; }
.cv .fx.sel rect { stroke: var(--sel); stroke-width: 2.5; }
.cv .pv rect { fill: rgba(255,101,116,.12); stroke: var(--sel); stroke-width: 2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.cv .sc line { stroke: var(--sel); stroke-width: 2; vector-effect: non-scaling-stroke; }
.cv .sc circle { fill: var(--sel); }
.cv .poly polygon { fill: rgba(255,101,116,.22); stroke: var(--coral); stroke-width: 2; vector-effect: non-scaling-stroke; }
.cv .poly.sel polygon { fill: rgba(255,101,116,.4); }
.cv .poly text { fill: #fff; font-weight: 800; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 3px; vector-effect: non-scaling-stroke; }
.cv .poly-draft polyline { fill: none; stroke: var(--coral); stroke-width: 2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }

/* Stil */
.opt { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); display: grid; gap: 4px; cursor: pointer; text-align: left; }
.opt[aria-pressed="true"] { border-color: var(--pri); box-shadow: inset 0 0 0 1px var(--pri); }
.opt b { font-size: 14px; } .opt span { color: var(--muted); font-size: 12.5px; }
.sw { display: flex; gap: 8px; flex-wrap: wrap; }
.sw button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); }
.sw button[aria-pressed="true"] { outline: 2px solid var(--pri); outline-offset: 2px; }
.preview svg { width: 100%; height: auto; max-height: 340px; }
table.sum { width: 100%; border-collapse: collapse; font-size: 13px; }
table.sum th, table.sum td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.sum th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 11px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: calc(100vw - 32px); }
#toast.on { opacity: 1; transform: translateX(-50%); }

@media (max-width: 1050px) { .ed { grid-template-columns: minmax(0,1fr); } .grid3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 680px) {
  .top { padding: 10px 16px; gap: 8px; } .top a.back span, .themebtn span, .brand small { display: none; }
  .steps { padding: 12px 16px 0; } .wrap { padding: 14px 16px 32px; }
  .grid2, .grid3 { grid-template-columns: minmax(0,1fr); }
  .item { grid-template-columns: 64px minmax(0,1fr); } .item img { width: 64px; height: 52px; } .item .meta { grid-template-columns: minmax(0,1fr); } .item > .row { grid-column: 1 / -1; }
  .stage { height: 62vh; }
}
</style>
</head>

<header class="top">
  <a class="brand" href="dashboard.html"><span class="mark">i</span><span>Immone<small>Objekt anlegen · Prototyp</small></span></a>
  <span class="grow"></span>
  <a class="back" href="dashboard.html"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span>Zum Dashboard</span></a>
  <button class="themebtn" id="themeBtn" type="button"></button>
</header>
<nav class="steps" id="steps" aria-label="Schritte"></nav>
<div class="wrap" id="view"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf1 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = () => Math.random().toString(36).slice(2, 9);
const r2 = v => Math.round(v * 100) / 100;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const I = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  up: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', next: '<path d="M9 6l6 6-6 6"/>', prev: '<path d="M15 6l-6 6 6 6"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', dl: '<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',
  play: '<path d="M7 5l12 7-12 7z"/>', spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>'
};
const ico = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }

// ---------- Theme (gemeinsam mit Dashboard & Navigator) ----------
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
function paintTheme() { const d = isDark(); $('#themeBtn').innerHTML = ico(d ? 'sun' : 'moon') + `<span>${d ? 'Hell' : 'Dunkel'}</span>`; $('#themeBtn').setAttribute('aria-label', d ? 'Hellen Modus einschalten' : 'Dunklen Modus einschalten'); }
$('#themeBtn').addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('immone-theme', t); paintTheme(); });
window.addEventListener('storage', e => { if (e.key === 'immone-theme') { const t = store.get('immone-theme', null); if (t) document.documentElement.dataset.theme = t; paintTheme(); } });
paintTheme();

// ---------- Bilder in IndexedDB (Fallback: Speicher) ----------
const MEM = {};
let dbp = null;
function db() {
  if (dbp) return dbp;
  dbp = new Promise(res => {
    try {
      const rq = indexedDB.open('immone-assistent', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('img');
      rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  return dbp;
}
async function imgPut(id, data) { MEM[id] = data; const d = await db(); if (!d) return; try { d.transaction('img', 'readwrite').objectStore('img').put(data, id); } catch (e) {} }
async function imgGet(id) {
  if (MEM[id]) return MEM[id];
  const d = await db(); if (!d) return null;
  return new Promise(res => { try { const rq = d.transaction('img').objectStore('img').get(id); rq.onsuccess = () => { MEM[id] = rq.result || null; res(MEM[id]); }; rq.onerror = () => res(null); } catch (e) { res(null); } });
}
function imgDel(id) { delete MEM[id]; db().then(d => { if (d) try { d.transaction('img', 'readwrite').objectStore('img').delete(id); } catch (e) {} }); }

// ---------- Zustand ----------
const KEY = 'immone-assistent-v1';
const blank = () => ({ step: 0, obj: { name: '', strasse: '', ort: '', art: 'miete', bau: 'neubau', etagen: '', proEtage: '', jahr: '' }, plans: [], photos: [], style: { linie: 'standard', moebliert: 'ja', wand: '#F4F1EA', boden: 'eiche-hell', kueche: 'weiss' }, cur: null, curPhoto: null });
let S = Object.assign(blank(), store.get(KEY, {}));
const save = () => store.set(KEY, S);
const STEPS = ['Objekt', 'Grundrisse', 'Prüfen', 'Außenfotos', 'Stil', 'Freigabe'];

const RT = { wohnen: 'Wohnen', kueche: 'Küche', schlafen: 'Schlafen', kind: 'Kinderzimmer', bad: 'Bad', wc: 'Gäste-WC', flur: 'Flur', diele: 'Diele', abstell: 'Abstellraum', arbeit: 'Arbeiten' };

const WALL = 0.12;
const doorW = t => (t === 'bad' || t === 'wc' || t === 'abstell') ? 0.76 : 0.885;
const winDef = t => (t === 'bad' || t === 'wc') ? { w: 0.7, sill: 1.4, top: 2.2 } : (t === 'schlafen' || t === 'kind' || t === 'arbeit') ? { w: 1.4, sill: 0.9, top: 2.3 } : { w: 1.4, sill: 0.5, top: 2.3 };

// ---------- Schritte ----------
function renderSteps() {
  $('#steps').innerHTML = STEPS.map((n, i) => `<button type="button" data-step="${i}" ${S.step === i ? 'aria-current="step"' : ''} class="${stepDone(i) ? 'done' : ''}"><b>${stepDone(i) && S.step !== i ? '✓' : i + 1}</b>${n}</button>`).join('');
  $$('#steps button').forEach(b => b.addEventListener('click', () => go(+b.dataset.step)));
}
function stepDone(i) {
  if (i === 0) return !!(S.obj.name && S.obj.strasse);
  if (i === 1) return S.plans.length > 0;
  if (i === 2) return S.plans.length > 0 && S.plans.every(p => p.checked && !validate(p).some(c => c.lvl === 'err'));
  if (i === 3) return S.photos.some(p => p.units.length);
  if (i === 4) return true;
  return false;
}
function go(i) { if (edState.cleanup) edState.cleanup(); S.step = Math.max(0, Math.min(STEPS.length - 1, i)); save(); render(); window.scrollTo(0, 0); }
function foot(prevOk = true, nextLabel = 'Weiter') {
  return `<div class="foot">${S.step > 0 && prevOk ? `<button class="btn" type="button" data-go="${S.step - 1}">${ico('prev')}Zurück</button>` : '<span></span>'}${S.step < STEPS.length - 1 ? `<button class="btn pri" type="button" data-go="${S.step + 1}">${nextLabel}${ico('next')}</button>` : ''}</div>`;
}
function bindFoot() { $$('[data-go]').forEach(b => b.addEventListener('click', () => go(+b.dataset.go))); }
function render() { renderSteps(); [vObjekt, vPlaene, vPruefen, vFotos, vStil, vFreigabe][S.step](); bindFoot(); }

// ---------- Upload-Helfer ----------
let pdfjs = null;
function loadPdfJs() {
  if (pdfjs) return pdfjs;
  pdfjs = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror = () => rej(new Error('PDF-Leser konnte nicht geladen werden')); document.head.appendChild(s);
  });
  return pdfjs;
}
async function fileToImages(file) {
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    const lib = await loadPdfJs(); const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise; const out = [];
    for (let i = 1; i <= Math.min(doc.numPages, 12); i++) {
      const pg = await doc.getPage(i); const vp = pg.getViewport({ scale: 2 }); const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; out.push({ name: file.name.replace(/\.pdf$/i, '') + (doc.numPages > 1 ? ' S. ' + i : ''), data: c.toDataURL('image/jpeg', 0.9), w: c.width, h: c.height });
    }
    return out;
  }
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = data; });
  let w = im.naturalWidth, h = im.naturalHeight, d = data;
  if (Math.max(w, h) > 3200) { const k = 3200 / Math.max(w, h); const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); d = c.toDataURL('image/jpeg', 0.9); w = c.width; h = c.height; }
  return [{ name: file.name.replace(/\.[^.]+$/, ''), data: d, w, h }];
}
function bindDrop(el, input, onFiles) {
  el.addEventListener('click', () => input.click());
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  ['dragenter', 'dragover'].forEach(t => el.addEventListener(t, e => { e.preventDefault(); el.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => el.addEventListener(t, e => { e.preventDefault(); el.classList.remove('over'); }));
  el.addEventListener('drop', e => onFiles(Array.from(e.dataTransfer.files)));
  input.addEventListener('change', () => { onFiles(Array.from(input.files)); input.value = ''; });
}

function planState(p) {
  const v = validate(p);
  if (!p.spec.rooms.length) return { cls: 'neutral', txt: 'Noch nicht erkannt', dot: 'warn' };
  if (v.some(c => c.lvl === 'err')) return { cls: 'err', txt: 'Fehler', dot: 'err' };
  if (!p.checked) return { cls: 'warn', txt: 'Prüfen', dot: 'warn' };
  return { cls: 'ok', txt: 'Geprüft', dot: 'ok' };
}

// ---------- Geometrie ----------
const rw = r => r.r[2] - r.r[0], rh = r => r.r[3] - r.r[1];
const m2 = (p, r) => (rw(r) / p.ppm) * (rh(r) / p.ppm);
function roomAt(sp, x, y) { return sp.rooms.find(r => x >= r.r[0] && x <= r.r[2] && y >= r.r[1] && y <= r.r[3]); }
// Wand zwischen zwei Räumen: liefert {sa, sb, axis, lo, hi, pos}
function sharedWall(p, a, b) {
  const tol = 0.35 * p.ppm, res = [];
  const ox0 = Math.max(a.r[0], b.r[0]), ox1 = Math.min(a.r[2], b.r[2]), oy0 = Math.max(a.r[1], b.r[1]), oy1 = Math.min(a.r[3], b.r[3]);
  if (ox1 - ox0 > 0.3 * p.ppm) {
    if (Math.abs(b.r[1] - a.r[3]) < tol) res.push({ sa: 'S', sb: 'N', axis: 'x', lo: ox0, hi: ox1, pos: (a.r[3] + b.r[1]) / 2 });
    if (Math.abs(a.r[1] - b.r[3]) < tol) res.push({ sa: 'N', sb: 'S', axis: 'x', lo: ox0, hi: ox1, pos: (a.r[1] + b.r[3]) / 2 });
  }
  if (oy1 - oy0 > 0.3 * p.ppm) {
    if (Math.abs(b.r[0] - a.r[2]) < tol) res.push({ sa: 'E', sb: 'W', axis: 'y', lo: oy0, hi: oy1, pos: (a.r[2] + b.r[0]) / 2 });
    if (Math.abs(a.r[0] - b.r[2]) < tol) res.push({ sa: 'W', sb: 'E', axis: 'y', lo: oy0, hi: oy1, pos: (a.r[0] + b.r[2]) / 2 });
  }
  return res;
}
// In Bildkoordinaten ist "oben" Norden → N = kleine y
function edgeOf(r, side) { return side === 'N' ? r.r[1] : side === 'S' ? r.r[3] : side === 'W' ? r.r[0] : r.r[2]; }
function isOuter(p, r, side) {
  return !p.spec.rooms.some(o => o !== r && sharedWall(p, r, o).some(w => w.sa === side));
}
function nearestEdge(p, x, y, outerOnly) {
  let best = null; const tol = 0.45 * p.ppm;
  for (const r of p.spec.rooms) for (const sd of 'NESW') {
    const horiz = sd === 'N' || sd === 'S'; const e = edgeOf(r, sd);
    const d = horiz ? Math.abs(y - e) : Math.abs(x - e);
    const inside = horiz ? (x > r.r[0] && x < r.r[2]) : (y > r.r[1] && y < r.r[3]);
    if (!inside || d > tol) continue;
    if (outerOnly && !isOuter(p, r, sd)) continue;
    if (!best || d < best.d) best = { r, sd, d, c: horiz ? x : y };
  }
  return best;
}

// ---------- Prüfregeln (Selbstkontrolle) ----------
function validate(p) {
  const sp = p.spec, out = [];
  if (!p.ppm) { out.push({ lvl: 'err', msg: 'Maßstab fehlt – zwei Punkte mit bekanntem Abstand anklicken.' }); return out; }
  if (!sp.rooms.length) { out.push({ lvl: 'err', msg: 'Noch keine Räume eingezeichnet.' }); return out; }
  for (let i = 0; i < sp.rooms.length; i++) for (let j = i + 1; j < sp.rooms.length; j++) {
    const a = sp.rooms[i], b = sp.rooms[j], m = 0.02 * p.ppm;
    if (a.r[0] + m < b.r[2] && b.r[0] + m < a.r[2] && a.r[1] + m < b.r[3] && b.r[1] + m < a.r[3]) out.push({ lvl: 'err', msg: `${a.name} und ${b.name} überlappen.`, sel: a.id });
  }
  for (const d of sp.doors) {
    const a = sp.rooms.find(r => r.id === d.a), b = sp.rooms.find(r => r.id === d.b);
    if (!a || !b || !sharedWall(p, a, b).length) out.push({ lvl: 'err', msg: 'Eine Tür verbindet keine zwei Räume.', sel: d.id });
  }
  if (!sp.entry) out.push({ lvl: 'err', msg: 'Wohnungseingang fehlt.' });
  else {

      <div><h3>Küchenfront</h3><div class="sw">${KUECHE.map(([k, n, c]) => `<button type="button" data-s="kueche" data-v="${k}" aria-pressed="${s.kueche === k}" style="background:${c}" aria-label="${n}" title="${n}"></button>`).join('')}</div></div>
    </div>
    <div class="note" style="margin-top:18px;margin-bottom:0">${ico('info')}<span>Jede Visualisierung wird automatisch mit „Visualisierung – Möblierung beispielhaft“ gekennzeichnet.</span></div></section>${foot()}`;
  $$('[data-s]').forEach(b => b.addEventListener('click', () => { s[b.dataset.s] = b.dataset.v; save(); vStil(); bindFoot(); }));
}

// ---------- 6 Freigabe ----------
function sketch(p) {
  const e = exportSpec(p), all = e.rooms.flatMap(r => [r.rect]).concat(e.balcony ? [e.balcony] : []);
  const x0 = Math.min(...all.map(r => r[0])) - 0.5, x1 = Math.max(...all.map(r => r[2])) + 0.5, y0 = Math.min(...all.map(r => r[1])) - 0.5, y1 = Math.max(...all.map(r => r[3])) + 0.5;
  const Y = y => y1 - y + y0;
  let s = `<svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" role="img" aria-label="Skizze ${esc(p.name)}">`;
  if (e.balcony) { const b = e.balcony; s += `<rect x="${b[0]}" y="${Y(b[3])}" width="${b[2] - b[0]}" height="${b[3] - b[1]}" fill="none" stroke="var(--room-line)" stroke-width=".05" stroke-dasharray=".2 .12"/>`; }
  e.rooms.forEach(r => { const [a, b, c, d] = r.rect; s += `<rect x="${a}" y="${Y(d)}" width="${c - a}" height="${d - b}" fill="var(--room)" stroke="var(--room-line)" stroke-width=".06"/><text x="${(a + c) / 2}" y="${Y((b + d) / 2)}" font-size=".34" text-anchor="middle" fill="var(--ink)" font-weight="700">${esc(r.name)}</text>`; });
  s += '</svg>'; return s;
}
function vFreigabe() {
  const plans = S.plans, ready = plans.length && plans.every(p => p.checked && !validate(p).some(c => c.lvl === 'err'));
  const units = plans.reduce((a, p) => a + (+p.count || 1), 0), photos = S.photos.reduce((a, p) => a + p.units.length, 0);
  const jobs = store.get('immone-jobs-v1', []);
  $('#view').innerHTML = `<section class="card"><h2>Zusammenfassung & Freigabe</h2><p class="sub">${esc(S.obj.name || 'Ohne Namen')} · ${esc([S.obj.strasse, S.obj.ort].filter(Boolean).join(', ') || 'keine Adresse')}</p>
    <table class="sum"><thead><tr><th>Wohnungstyp</th><th>Anzahl</th><th>Räume</th><th>Wohnfläche</th><th>Status</th></tr></thead><tbody>
    ${plans.map(p => { const st = planState(p); return `<tr><td>${esc(p.name)}</td><td>${esc(p.count)}${p.etagen ? ' · Etage ' + esc(p.etagen) : ''}</td><td>${p.spec.rooms.length}</td><td>${p.ppm && p.spec.rooms.length ? nf1.format(wohnflaeche(p)) + ' m²' : '–'}</td><td><span class="pill ${st.cls}">${st.txt}</span></td></tr>`; }).join('') || '<tr><td colspan="5">Keine Grundrisse</td></tr>'}
    </tbody></table>
    <div class="grid3" style="margin-top:16px">${plans.filter(p => p.ppm && p.spec.rooms.length).map(p => `<div class="preview card" style="padding:12px"><h3>${esc(p.name)}</h3>${sketch(p)}</div>`).join('')}</div>
    <div class="grid3" style="margin-top:16px"><div class="kv"><span>Wohnungen gesamt</span><b>${units}</b></div><div class="kv"><span>Davon auf Fotos markiert</span><b>${photos}</b></div><div class="kv"><span>Zu rendernde Typen</span><b>${plans.length}</b></div></div>
    ${photos < units ? `<div class="note" style="margin-top:14px">${ico('info')}<span>Auf den Außenfotos sind ${photos} von ${units} Wohnungen markiert. Das Rendern geht trotzdem; im Navigator sind dann nur die markierten anklickbar.</span></div>` : ''}
    <div class="row" style="margin-top:16px"><button class="btn pri" type="button" id="order" ${ready ? '' : 'disabled'}>${ico('play')}Visualisierung beauftragen</button>${ready ? '' : '<span class="sub" style="margin:0">Erst alle Grundrisse prüfen und bestätigen.</span>'}</div>
    <div class="note" style="margin-top:14px;margin-bottom:0">${ico('info')}<span>Prototyp: Der Auftrag wird als Datei heruntergeladen. Später geht er automatisch an den Render-Server, und du bekommst eine E-Mail, wenn alles fertig ist.</span></div>
  </section>
  ${jobs.length ? `<section class="card" style="margin-top:14px"><h3>Aufträge</h3><table class="sum"><thead><tr><th>Objekt</th><th>Erstellt</th><th>Typen</th><th>Status</th></tr></thead><tbody>${jobs.map(j => `<tr><td>${esc(j.name)}</td><td>${new Date(j.t).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' })}</td><td>${j.n}</td><td><span class="pill warn">Wartet auf Rendern</span></td></tr>`).join('')}</tbody></table></section>` : ''}
  ${foot()}`;
  const b = $('#order'); if (b) b.addEventListener('click', () => {
    const job = { version: 1, erstellt: new Date().toISOString(), objekt: S.obj, stil: S.style, typen: plans.map(exportSpec), fotos: S.photos.map(p => ({ name: p.name, wohnungen: p.units })) };
    download('auftrag_' + slug(S.obj.name || 'objekt') + '.json', JSON.stringify(job, null, 1));
    jobs.unshift({ name: S.obj.name || 'Ohne Namen', t: Date.now(), n: plans.length }); store.set('immone-jobs-v1', jobs.slice(0, 20));
    toast('Auftrag erstellt'); vFreigabe(); bindFoot();
  });
}

// Prüfen-Seite: Seitenleiste nach dem Aufbau füllen
const origRender = render;
render = function () { origRender(); if (S.step === 2 && curPlan()) refreshSide(); };
render();
})();
</script>
</body>
</html>
